<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>소환사의 협곡에 오신 것을 환영합니다</title>
    <style>
        :root {
            --lol-gold: #c8aa6e;
            --lol-blue: #0bc6e3;
            --lol-dark: #010a13;
            --lol-border: #3c3c41;
            --lol-bg-dark: #0a1428;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: black;
            font-family: 'Noto Sans KR', sans-serif; color: white;
        }

        /* 가로 모드 유도 */
        @media (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }
        #rotate-overlay {
            display: none; position: fixed; z-index: 9999;
            width: 100%; height: 100%; background: var(--lol-dark);
            flex-direction: column; align-items: center; justify-content: center;
        }

        /* 공통 화면 설정 */
        .screen {
            position: absolute; width: 100%; height: 100%;
            transition: opacity 0.5s ease; display: flex;
        }

        /* --- 1단계: 로그인 화면 --- */
        #login-screen {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://imgur.com/your-login-bg.jpg') center/cover;
            z-index: 4; justify-content: center; align-items: center;
        }
        .login-box {
            background: rgba(1, 10, 19, 0.9); padding: 5vw; 
            border: 2px solid var(--lol-gold); text-align: center; 
            width: 80%; max-width: 350px; border-radius: 10px;
        }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 15px; 
            box-sizing: border-box; background: #111; 
            border: 1px solid var(--lol-blue); color: white; font-size: 1rem;
        }
        .btn-login {
            width: 100%; padding: 12px; background: var(--lol-blue); 
            border: none; color: white; font-weight: bold; 
            font-size: 1.1rem; cursor: pointer; margin-bottom: 10px; transition: 0.3s;
        }
        .btn-guest {
            width: 100%; padding: 12px; background: transparent; 
            border: 1px solid var(--lol-gold); color: var(--lol-gold); 
            font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        .btn-login:hover, .btn-guest:hover { filter: brightness(1.2); }

        /* --- 2단계: 큐 수락 화면 --- */
        #queue-screen {
            background-color: rgba(0, 0, 0, 0.95); z-index: 3;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .circle-container {
            position: relative; width: 45vh; height: 45vh; min-width: 250px; min-height: 250px;
            border-radius: 50%; background: radial-gradient(circle, #0a1428 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid #005a82; box-shadow: 0 0 20px #0ac8b9; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px #0ac8b9; }
            50% { box-shadow: 0 0 40px #0bc6e3; }
            100% { box-shadow: 0 0 10px #0ac8b9; }
        }
        #accept-btn {
            margin-top: 2vh; padding: 1vh 4vw; background-color: transparent;
            color: var(--lol-gold); border: 2px solid var(--lol-gold);
            font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        #accept-btn:hover { background: rgba(200, 170, 110, 0.2); box-shadow: 0 0 15px var(--lol-gold); }

        /* --- 3단계: 픽창 (챔피언 선택 화면) --- */
        #pick-screen {
            background-color: var(--lol-bg-dark);
            z-index: 2; flex-direction: column;
            opacity: 0; pointer-events: none; /* 초기엔 숨김 */
        }
        .pick-header {
            text-align: center; padding: 3vh; font-size: 1.5rem; 
            color: var(--lol-gold); border-bottom: 2px solid var(--lol-border);
        }
        .pick-content {
            flex: 1; display: flex; justify-content: center; align-items: center; gap: 5vw;
        }
        .champ-card {
            width: 20vw; height: 50vh; max-width: 200px; max-height: 350px;
            background: #111; border: 2px solid var(--lol-border);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 0.3s;
        }
        .champ-card:hover { border-color: var(--lol-gold); box-shadow: 0 0 20px rgba(200,170,110,0.5); }
        .champ-img {
            width: 80%; aspect-ratio: 1/1; background: #333; border-radius: 50%; margin-bottom: 2vh;
            /* 이곳에 신랑/신부 사진 url을 넣으시면 됩니다 */
            background-size: cover; background-position: center;
        }
        .champ-name { font-size: 1.2rem; font-weight: bold; }
        .champ-role { font-size: 0.9rem; color: #888; margin-top: 5px; }
        
        .start-game-btn-container { text-align: center; padding: 3vh; }
        #start-game-btn {
            padding: 1.5vh 5vw; background: var(--lol-blue); border: none;
            color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            border-radius: 5px;
        }
        #start-game-btn:hover { filter: brightness(1.2); }

        /* --- 4단계: 메인 로비 화면 (청첩장 본문) --- */
        #lobby-screen {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://imgur.com/your-lobby-bg.jpg') center/cover;
            opacity: 0; z-index: 1; pointer-events: none; flex-direction: row;
        }
        .side-nav {
            width: 25%; max-width: 150px; background: rgba(0,0,0,0.8);
            border-right: 1px solid var(--lol-border); display: flex; flex-direction: column; padding-top: 2vh;
        }
        .nav-item {
            padding: 2vh 1vw; cursor: pointer; font-size: 0.8rem;
            border-left: 3px solid transparent; text-align: center;
        }
        .nav-item:hover { background: rgba(200, 170, 110, 0.1); border-left: 3px solid var(--lol-gold); color: var(--lol-gold); }
        .main-content {
            flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 4vw;
        }
        .wedding-title { font-size: 2rem; font-weight: 900; color: var(--lol-gold); }
        .wedding-desc { font-size: 0.9rem; max-width: 100%; line-height: 1.5; margin-top: 15px; }
        .friend-list {
            width: 30%; max-width: 200px; background: rgba(0,0,0,0.85);
            border-left: 1px solid var(--lol-border); padding: 2vh 2vw; overflow-y: auto;
        }
        .friend-item { display: flex; align-items: center; margin-bottom: 1.5vh; font-size: 0.8rem; }
        .status-online { color: #2ecc71; font-size: 0.7rem; }
        .hidden { opacity: 0 !important; pointer-events: none; display: none !important; }
    </style>
</head>
<body>

    <div id="rotate-overlay"> 화면을 가로로 돌려주세요 🔄 </div>

    <audio id="accept-sound" src="queue-pop.mp3" preload="auto"></audio>
    <audio id="lobby-bgm" src="lobby-bgm.mp3" loop preload="auto"></audio>

    <div id="login-screen" class="screen">
        <div class="login-box">
            <h1 style="color: var(--lol-gold); margin-bottom: 20px; font-size: 1.5rem;">클라이언트 접속</h1>
            <input type="text" id="nickname-input" class="login-input" placeholder="소환사명 (닉네임) 입력">
            <button class="btn-login" onclick="login(false)">로그인</button>
            <button class="btn-guest" onclick="login(true)">게스트로 입장하기</button>
        </div>
    </div>

        <div id="queue-screen" class="screen hidden">
        <div class="circle-container">
            <h2 style="font-size: 2rem; margin-bottom: 5px;">웨딩을 찾았습니다!</h2>
            <p style="color: #a09b8c; font-size: 0.9rem; margin-top: 0; text-align: center;">제이아트 • 11.15 • 영원한 듀오 • 2인큐</p>
            <button id="accept-btn" onclick="goToPick()">수락!</button>
        </div>
    </div>

    <div id="pick-screen" class="screen">
        <div class="pick-header">
            평생을 함께할 챔피언을 선택하세요
        </div>
        <div class="pick-content">
            <div class="champ-card">
                <div class="champ-img" style="background-image: url('신랑사진URL.jpg');"></div>
                <div class="champ-name">신랑 000</div>
                <div class="champ-role">탑 (탱커)</div>
            </div>
            <div class="champ-card">
                <div class="champ-img" style="background-image: url('신부사진URL.jpg');"></div>
                <div class="champ-name">신부 000</div>
                <div class="champ-role">서포터 (힐러)</div>
            </div>
        </div>
        <div class="start-game-btn-container">
            <button id="start-game-btn" onclick="startGame()">결혼(게임) 시작</button>
        </div>
    </div>

    <div id="lobby-screen" class="screen">
        <div class="side-nav">
            <div style="background: #1e2328; border: 1px solid var(--lol-gold); color: var(--lol-gold); padding: 1vh; margin: 1vh; text-align: center; font-weight: bold; font-size: 0.8rem;">예식장 확인</div>
            <div class="nav-item">날짜 확인</div>
            <div class="nav-item">신랑측 계좌</div>
            <div class="nav-item">신부측 계좌</div>
            <div class="nav-item">방명록 작성</div>
        </div>

        <div class="main-content">
            <div class="wedding-title">신랑 OO & 신부 OO</div>
            <div class="wedding-desc">
                그들은 서로가 죽음으로 모든 게 끝날 줄 알았습니다.<br>
                하지만, 그것은 오산이었습니다.<br>
                새로운 랭크 게임(결혼)이 시작됩니다.
            </div>
            <button style="margin-top: 20px; width: 120px; background: var(--lol-gold); border: none; padding: 10px; cursor: pointer; font-weight: bold; font-size: 0.9rem;">갤러리 보기</button>
        </div>

        <div class="friend-list">
            <div style="display: flex; align-items: center; border-bottom: 1px solid var(--lol-gold); padding-bottom: 10px; margin-bottom: 15px;">
                <div style="width: 35px; height: 35px; background: var(--lol-blue); border-radius: 50%; margin-right: 10px;"></div>
                <div>
                    <div id="display-nickname" style="font-weight: bold; color: var(--lol-gold); font-size: 1rem;">소환사</div>
                    <div style="color: #2ecc71; font-size: 0.7rem;">● 접속 중</div>
                </div>
            </div>

            <div style="font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; font-size: 0.8rem;">소셜 (가족)</div>
            <div class="friend-item">
                <div style="width: 30px; height: 30px; background: #555; border-radius: 50%; margin-right: 10px;"></div>
                <div><div>신랑 부친 OOO</div><div class="status-online">● 온라인</div></div>
            </div>
            <div class="friend-item">
                <div style="width: 30px; height: 30px; background: #555; border-radius: 50%; margin-right: 10px;"></div>
                <div><div>신부 부친 OOO</div><div class="status-online">● 온라인</div></div>
            </div>
        </div>
    </div>

    <script>
        // 1. 로그인 -> 큐 화면
        function login(isGuest) {
            let nickname = "게스트";
            if (!isGuest) {
                const inputVal = document.getElementById('nickname-input').value.trim();
                if (inputVal === "") {
                    alert("닉네임을 입력해주세요.");
                    return;
                }
                nickname = inputVal;
            }

            document.getElementById('display-nickname').innerText = nickname;

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('queue-screen').classList.remove('hidden');

            const sound = document.getElementById('accept-sound');
            sound.play().catch(e => console.log("효과음 재생 차단됨", e));
        }

        // 2. 큐 수락 -> 픽창 화면
        function goToPick() {
            // 큐 화면 숨김
            document.getElementById('queue-screen').classList.add('hidden');
            
            // 픽창 표시
            const pickScreen = document.getElementById('pick-screen');
            pickScreen.style.opacity = '1';
            pickScreen.style.pointerEvents = 'auto';
        }

        // 3. 픽창 -> 메인 로비 (게임 시작)
        function startGame() {
            // BGM 재생
            const bgm = document.getElementById('lobby-bgm');
            bgm.volume = 0.3; 
            bgm.play().catch(e => console.log("BGM 재생 차단됨", e));

            // 픽창 숨김
            const pickScreen = document.getElementById('pick-screen');
            pickScreen.classList.add('hidden');
            pickScreen.style.opacity = '0'; // 트랜지션용
            
            // 로비 표시
            const lobbyScreen = document.getElementById('lobby-screen');
            lobbyScreen.style.opacity = '1';
            lobbyScreen.style.pointerEvents = 'auto'; 
        }
    </script>
</body>
</html>
